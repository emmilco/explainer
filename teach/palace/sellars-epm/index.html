<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empiricism and the Philosophy of Mind — a walk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0b0e12; overflow: hidden; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(9, 12, 17, 0.78);
    color: #efe6d6; font-family: Georgia, serif; text-align: center; transition: opacity 1.2s; z-index: 2; }
  #overlay h1 { font-weight: 400; font-size: 42px; margin: 0 0 6px; letter-spacing: 0.01em; }
  #overlay .sub { font-style: italic; opacity: 0.75; margin-bottom: 24px; }
  #overlay .status { font: 13px/1.4 ui-sans-serif, system-ui; opacity: 0.6; margin-bottom: 22px; min-height: 1.4em; }
  #overlay button { font: 15px ui-sans-serif, system-ui; padding: 10px 30px; border-radius: 999px; border: 1px solid #efe6d6;
    background: transparent; color: #efe6d6; cursor: pointer; }
  #overlay button:disabled { opacity: 0.3; cursor: default; }
  #card { position: fixed; left: 50%; top: 11%; transform: translateX(-50%); color: #f3ecdf; font: 400 26px Georgia, serif;
    text-shadow: 0 1px 12px rgba(0,0,0,0.55); opacity: 0; transition: opacity 1.6s; pointer-events: none; text-align: center; }
  #card small { display: block; font: 12px ui-sans-serif, system-ui; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.8; margin-bottom: 6px; }
  #hud { position: fixed; right: 16px; bottom: 12px; font: 12px ui-monospace, monospace; color: #fff; opacity: 0.28; }
  #keys { position: fixed; left: 16px; bottom: 12px; font: 12px ui-sans-serif, system-ui; color: #fff; opacity: 0.28; }
  #chapBtn { position: fixed; left: 16px; top: 14px; font: 12px ui-sans-serif, system-ui; color: #fff; opacity: 0.35;
    cursor: pointer; letter-spacing: 0.12em; text-transform: uppercase; user-select: none; z-index: 1; }
  #chapBtn:hover { opacity: 0.8; }
  #chapters { position: fixed; left: 12px; top: 40px; width: 360px; max-height: calc(100% - 90px); overflow-y: auto;
    background: rgba(10, 13, 18, 0.86); border: 1px solid rgba(239, 230, 214, 0.18); border-radius: 8px; padding: 6px 0;
    color: #efe6d6; font: 14px/1.35 Georgia, serif; display: none; z-index: 3; backdrop-filter: blur(6px); }
  #chapters.open { display: block; }
  #chapters div { padding: 7px 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  #chapters div:hover { background: rgba(239, 230, 214, 0.08); }
  #chapters div.cur { background: rgba(239, 230, 214, 0.14); }
  #chapters small { font: 11px ui-monospace, monospace; opacity: 0.55; align-self: center; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../engine/vendor/three/three.module.js",
  "three/addons/": "../engine/vendor/three/addons/",
  "ez-tree": "../engine/vendor/ez-tree/ez-tree.es.js"
} }
</script>
</head>
<body>
<div id="overlay"><div>
  <h1>Empiricism and the Philosophy of Mind</h1>
  <div class="sub">Wilfrid Sellars, 1956 — a walk through the argument</div>
  <div class="status">Loading…</div>
  <button disabled>Begin</button>
</div></div>
<div id="card"></div>
<div id="chapBtn">Chapters</div>
<div id="chapters"></div>
<div id="hud"></div>
<div id="keys">space pause · ←/→ 15 s</div>
<audio id="narration" preload="auto"></audio>
<script type="module">
import * as THREE from 'three';
import { createEngine } from '../engine/app.js';
import { createWalk } from '../engine/walker.js';

const q = new URLSearchParams(location.search);
const overlay = document.getElementById('overlay'), status = overlay.querySelector('.status'), btn = overlay.querySelector('button');
const say = (s) => { status.textContent = s; };
const [plan, walkData, manifest] = await Promise.all(['plan.json', 'walk.json', 'images/manifest.json'].map((f) => fetch(f).then((r) => r.json())));
// The narration is loaded whole into memory: seeking a streamed <audio> needs HTTP Range support,
// which simple static servers (python -m http.server) lack, and without it every seek restarts at 0.
const narrationReady = fetch('narration.m4a').then((r) => r.blob()).then((b) => { document.getElementById('narration').src = URL.createObjectURL(b); });
const images = Object.fromEntries(Object.entries(manifest).map(([id, m]) => [id, { ...m, url: m.file }]));
const tall = plan.vignettes.filter((v) => v.kind === 'tallgrass').map((v) => ({ x: v.c[0], z: v.c[2], r: v.r }));

const engine = await createEngine({ spec: plan.spec, tables: plan.tables, clear: plan.clear, tall, assetBase: '../engine/assets', quality: q.get('q') || 'high', status: say });
const walk = await createWalk({ engine, plan, images, assetBase: '../engine/assets' });

// unit title cards
const units = [];
for (const b of walkData.blocks) if (!units.find((u) => u.unit === b.unit)) units.push({ unit: b.unit, title: b.unit_title, t0: plan.blocks.find((p) => p.id === b.id).t0 });
const card = document.getElementById('card');
let shownUnit = null;
function showCard(t) {
  const u = [...units].reverse().find((u) => t >= u.t0 - 1);
  const on = u && t < u.t0 + 7;
  if (on && shownUnit !== u.unit) {
    shownUnit = u.unit;
    const part = PARTS[u.unit];
    card.innerHTML = part ? `<small>Part${part.includes('–') ? 's' : ''} ${part}</small>${bareTitle(u)}` : bareTitle(u);
  }
  card.style.opacity = on ? 1 : 0;
}

// clock: the narration track when playing; otherwise a held time
const audio = document.getElementById('narration');
audio.muted = q.get('mute') === '1';
let t = parseFloat(q.get('t') || '0'), playing = false;
const fmt = (s) => `${Math.floor(s / 3600) ? Math.floor(s / 3600) + ':' : ''}${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
async function seek(nt) {
  t = THREE.MathUtils.clamp(nt, 0, plan.end);
  const was = playing; if (was) audio.pause();
  await walk.warmTo(t);
  audio.currentTime = t;
  if (was) audio.play();
}
say('Building the landscape around the start…');
await walk.warmTo(t);
say(`${fmt(plan.end)} · ${plan.stops.length} stops`);
say('Loading the narration…');
await narrationReady;
say(`${fmt(plan.end)} · ${plan.stops.length} stops`);
btn.disabled = false;
btn.onclick = () => { overlay.style.opacity = 0; setTimeout(() => overlay.remove(), 1300); audio.currentTime = t; audio.play(); playing = true; };
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); playing = !playing; if (playing) { audio.currentTime = t; audio.play(); } else audio.pause(); }
  if (e.code === 'ArrowRight') seek(t + 15);
  if (e.code === 'ArrowLeft') seek(t - 15);
});

// ---------- free walk: F toggles; mouse looks (pointer lock), WASD walks, shift jogs ----------
const lockPointer = () => { try { const r = engine.renderer.domElement.requestPointerLock?.(); r?.catch?.(() => {}); } catch (e) { /* lock refused: keys still work */ } };
const W = engine.world, canvas = engine.renderer.domElement;
let mode = 'walk';                      // 'walk' | 'free' | 'return'
const free = { pos: new THREE.Vector3(), yaw: 0, pitch: 0, keys: new Set() };
let ret = null;                         // { from, fromQ, t0 } while gliding back to the trail
const eFree = new THREE.Euler(0, 0, 0, 'YXZ');
function enterFree(pose) {
  mode = 'free';
  free.pos.copy(pose.pos);
  eFree.setFromQuaternion(pose.quat, 'YXZ'); free.yaw = eFree.y; free.pitch = eFree.x;
  lockPointer();
  keysEl.textContent = 'free walk · mouse look · WASD · shift jog · F return to the trail';
}
function leaveFree() {
  mode = 'return';
  ret = { from: free.pos.clone(), fromQ: new THREE.Quaternion().setFromEuler(new THREE.Euler(free.pitch, free.yaw, 0, 'YXZ')), t0: performance.now() };
  document.exitPointerLock?.();
  keysEl.textContent = keysDefault;
}
canvas.addEventListener('click', () => { if (mode === 'free' && document.pointerLockElement !== canvas) lockPointer(); });
addEventListener('mousemove', (e) => {
  if (mode !== 'free' || document.pointerLockElement !== canvas) return;
  free.yaw -= e.movementX * 0.0022;
  free.pitch = THREE.MathUtils.clamp(free.pitch - e.movementY * 0.0022, -1.35, 1.35);
});
addEventListener('keydown', (e) => {
  if (e.code === 'KeyF') { if (mode === 'free') leaveFree(); else if (mode === 'walk') enterFree(walk.pose(t)); }
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ShiftRight'].includes(e.code)) free.keys.add(e.code);
});
addEventListener('keyup', (e) => free.keys.delete(e.code));
const keysEl = document.getElementById('keys'), keysDefault = 'space pause · ←/→ 15 s · [ ] chapter · C chapters · F free walk';
keysEl.textContent = keysDefault;
function stepFree(dt) {
  const k = free.keys, fwd = (k.has('KeyW') ? 1 : 0) - (k.has('KeyS') ? 1 : 0), side = (k.has('KeyD') ? 1 : 0) - (k.has('KeyA') ? 1 : 0);
  const speed = (k.has('ShiftLeft') || k.has('ShiftRight')) ? 5 : 1.8;
  if (fwd || side) {
    const l = Math.hypot(fwd, side), sy = Math.sin(free.yaw), cy = Math.cos(free.yaw);
    free.pos.x += (-sy * fwd + cy * side) / l * speed * dt;
    free.pos.z += (-cy * fwd - sy * side) / l * speed * dt;
  }
  free.pos.x = THREE.MathUtils.clamp(free.pos.x, W.X0 - W.PAD + 50, W.X1 + W.PAD - 50);
  free.pos.z = THREE.MathUtils.clamp(free.pos.z, -3400, 3400);
  const gy = Math.max(W.height(free.pos.x, free.pos.z), ...(W.stillWaters.filter((s) => free.pos.x > s.x0 && free.pos.x < s.x1).map((s) => s.y + 0.3))) + plan.EYE;
  free.pos.y += (gy - free.pos.y) * Math.min(1, dt * 10);
  return { pos: free.pos.clone(), quat: new THREE.Quaternion().setFromEuler(new THREE.Euler(free.pitch, free.yaw, 0, 'YXZ')) };
}

// ---------- chapters: C (or the label) opens the list; [ and ] step; jumps move walk + audio together ----------
const chapEl = document.getElementById('chapters');
const PARTS = { U0: '', U1: 'I', U2: 'II', U3: 'III', U4: 'IV', U5: 'V–VI', U6: 'VII', U7: 'VIII', U8: 'IX', U9: 'X–XI', U10: 'XII–XIV', U11: 'XV', U12: 'XVI' };
const bareTitle = (u) => (u.title.split(' · ').slice(1).join(' · ') || u.title).replace(/^Parts? [IVX–-]+:\s*/, '');
const chapTitle = (u) => (PARTS[u.unit] ? `<em style="opacity:.6;font-style:normal">${PARTS[u.unit]}</em>&ensp;` : '') + bareTitle(u);
units.forEach((u, i) => {
  const d = document.createElement('div');
  d.innerHTML = `<span>${chapTitle(u)}</span><small>${fmt(u.t0)}</small>`;
  d.onclick = () => goChapter(i);
  chapEl.appendChild(d);
});
const curChapter = () => { let i = 0; units.forEach((u, k) => { if (t >= u.t0 - 1.5) i = k; }); return i; };
async function goChapter(i) {
  i = THREE.MathUtils.clamp(i, 0, units.length - 1);
  chapEl.classList.remove('open');
  if (mode !== 'walk') { mode = 'walk'; document.exitPointerLock?.(); keysEl.textContent = keysDefault; }
  shownUnit = null;
  await seek(Math.max(0, units[i].t0 - 1));
}
document.getElementById('chapBtn').onclick = () => chapEl.classList.toggle('open');
addEventListener('keydown', (e) => {
  if (e.code === 'KeyC') chapEl.classList.toggle('open');
  if (e.code === 'BracketRight') goChapter(curChapter() + 1);
  if (e.code === 'BracketLeft') goChapter(t - units[curChapter()].t0 > 8 ? curChapter() : curChapter() - 1);
  if (e.code === 'Escape') chapEl.classList.remove('open');
});

const hud = document.getElementById('hud');
let lastNow = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (playing && !audio.paused) t = audio.currentTime;
  const trail = walk.pose(t);
  let { pos, quat } = trail;
  const { s } = trail;
  if (mode === 'free') ({ pos, quat } = stepFree(dt));
  else if (mode === 'return') {
    const k = THREE.MathUtils.smootherstep(Math.min(1, (now - ret.t0) / 2500), 0, 1);
    pos = ret.from.clone().lerp(trail.pos, k); quat = ret.fromQ.clone().slerp(trail.quat, k);
    if (k >= 1) mode = 'walk';
  }
  walk.sync(s);
  for (const w of walk.winds) w.value = now / 1000;
  engine.frame(pos, quat, now / 1000);
  showCard(t);
  hud.textContent = `${fmt(t)} / ${fmt(plan.end)}`;
  if (chapEl.classList.contains('open')) { const c = curChapter(); [...chapEl.children].forEach((d, i) => d.classList.toggle('cur', i === c)); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__walk = { ready: true, seek, plan, stops: plan.stops.map((s) => s.tArrive), stats: () => engine.renderer.info.render };
</script>
</body>
</html>
